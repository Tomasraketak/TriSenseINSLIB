name=TriSenseINSLIB
version=0.1.0
author=VoltinoLabs (Tomas Michal); includes INSLIB by Jan Zwiener
maintainer=Tomas Michal <obchod@voltinolabs.cz>
sentence=Inertial navigation for Voltino TriSense: attitude, position, velocity, acceleration and baro altitude from INSLIB's 15-state Kalman filter.
paragraph=Connects the Voltino TriSense module (Voltino_TriSense library) to INSLIB, a 15-state error-state Kalman filter with parallel AHRS and barometric vertical channel. Without GNSS: roll, pitch, heading, height and vertical speed (rockets, CanSat). With GNSS: full position, velocity and acceleration. AGPL-3.0 because INSLIB is AGPL-3.0. Needs an MCU with FPU: Raspberry Pi Pico 2 (RP2350), ESP32-S3, Teensy 4.x.
category=Sensors
url=https://github.com/Tomasraketak/TriSenseINSLIB
architectures=rp2040,esp32,teensy
depends=Voltino_TriSense, TinyGPSPlus
includes=TriSenseINS.h
