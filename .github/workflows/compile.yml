name: Compile examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-test:
    name: Host test (simulated TriSense)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make -C tests/host

  compile:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: Raspberry Pi Pico 2 (RP2350)
            fqbn: rp2040:rp2040:rpipico2
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - name: Teensy 4.1
            fqbn: teensy:avr:teensy41
            platforms: |
              - name: teensy:avr
                source-url: https://www.pjrc.com/teensy/package_teensy_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
            - name: Voltino_TriSense
            - name: TinyGPSPlus
          sketch-paths: |
            - examples
          enable-warnings-report: true
          enable-deltas-report: false
          verbose: false
